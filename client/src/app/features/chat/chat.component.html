<section class="chat-container">
  <!-- Messages Area -->
  <div class="chat-scroll-area" #scrollContainer>
    <div class="message-list" *ngIf="messages.length; else emptyState">
      <article
        *ngFor="let message of messages"
        class="message-wrapper"
        [class.user]="message.role === 'user'"
        [class.ai]="message.role !== 'user'"
      >
        <!-- AI Message -->
        <ng-container *ngIf="message.role !== 'user'">
          <div class="ai-avatar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </div>
          <div class="message-bubble ai-bubble">
            <div class="message-content">
              <div class="md-content" [innerHTML]="message.displayContent | markdown"></div>
              <span class="typing-cursor" *ngIf="message.isTyping">|</span>
            </div>
            <div class="message-footer" *ngIf="!message.isTyping">
              <div class="message-actions">
                <!-- Copy button -->
                <button class="action-btn" title="Copy" (click)="copyText(message.content)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
                <!-- Play / Pause / Resume button -->
                <button class="action-btn" title="Listen" (click)="speakMessage(message.content)" *ngIf="speakerStatus === 'idle'">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                </button>
                <button class="action-btn active-speaker" title="Pause" (click)="pauseSpeaking()" *ngIf="speakerStatus === 'speaking'">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                  </svg>
                </button>
                <button class="action-btn" title="Resume" (click)="resumeSpeaking()" *ngIf="speakerStatus === 'paused'">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- User Message -->
        <ng-container *ngIf="message.role === 'user'">
          <div class="message-bubble user-bubble">
            <p>{{ message.content }}</p>
          </div>
        </ng-container>
      </article>

      <!-- Typing Indicator -->
      <article class="message-wrapper ai" *ngIf="isLoading">
        <div class="ai-avatar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
        <div class="message-bubble ai-bubble typing-bubble">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </article>
    </div>

    <!-- Empty State -->
    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-orb orb-1"></div>
        <div class="empty-orb orb-2"></div>

        <div class="empty-icon-wrap">
          <div class="empty-icon-ring"></div>
          <div class="empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </div>
        </div>

        <h2 class="empty-title">Ask AVA anything</h2>
        <p class="empty-subtitle">
          Type or speak — AVA will help you write, research, code, and more.
        </p>

        <div class="suggestion-grid">
          <button class="suggestion-card" type="button" (click)="useSuggestion('I need to draft a professional email. Before you write it, please ask me 2-3 short questions about the recipient, the main topic, and the tone I want to use.')">
            <div class="suggestion-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><polyline points="3 7 12 13 21 7"></polyline></svg>
            </div>
            <div class="suggestion-text">
              <span class="suggestion-title">Draft an email</span>
              <span class="suggestion-desc">Write professional emails fast</span>
            </div>
          </button>

          <button class="suggestion-card" type="button" (click)="useSuggestion('I want you to explain a complex concept to me. Please ask me what concept I want explained and my current level of understanding before you begin.')">
            <div class="suggestion-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
            </div>
            <div class="suggestion-text">
              <span class="suggestion-title">Explain a concept</span>
              <span class="suggestion-desc">Simplify complex topics</span>
            </div>
          </button>

          <button class="suggestion-card" type="button" (click)="useSuggestion('I need you to write some code for me. Please ask me what programming language to use, what the specific task is, and if there are any constraints before you generate the script.')">
            <div class="suggestion-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            </div>
            <div class="suggestion-text">
              <span class="suggestion-title">Write code</span>
              <span class="suggestion-desc">Generate scripts & snippets</span>
            </div>
          </button>

          <button class="suggestion-card" type="button" (click)="useSuggestion('I have some text I need summarized. Please ask me to provide the text and tell you how detailed the summary should be.')">
            <div class="suggestion-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="7" y2="18"></line></svg>
            </div>
            <div class="suggestion-text">
              <span class="suggestion-title">Summarize text</span>
              <span class="suggestion-desc">Get the key points quickly</span>
            </div>
          </button>
        </div>
      </div>
    </ng-template>
  </div>

  <!-- Input Bar (Gemini-style) -->
  <div class="chat-input-wrapper">
    <!-- Voice conversation mode indicator -->
    <div class="voice-mode-badge" *ngIf="voiceConversationMode && voiceStatus !== 'listening' && speakerStatus === 'idle' && !isLoading">
      <span class="badge-dot"></span>
      <span>Voice mode active — AVA will auto-listen</span>
      <button class="badge-close" (click)="voiceConversationMode = false" title="Exit voice mode">✕</button>
    </div>

    <div class="input-form" [class.voice-active]="voiceStatus === 'listening'" [class.speaker-active]="speakerStatus === 'speaking' || speakerStatus === 'paused'">

      <!-- Listening inline UI -->
      <ng-container *ngIf="voiceStatus === 'listening'">
        <div class="listening-inline">
          <div class="listening-wave">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <span class="listening-transcript" *ngIf="messageControl.value">{{ messageControl.value }}</span>
          <span class="listening-placeholder" *ngIf="!messageControl.value">Listening…</span>
        </div>
      </ng-container>

      <!-- Speaker inline UI -->
      <ng-container *ngIf="(speakerStatus === 'speaking' || speakerStatus === 'paused') && voiceStatus !== 'listening'">
        <div class="speaker-inline">
          <div class="speaker-bars" *ngIf="speakerStatus === 'speaking'">
            <span></span><span></span><span></span><span></span>
          </div>
          <span class="speaker-label">{{ speakerStatus === 'speaking' ? 'AVA speaking…' : 'Paused' }}</span>
        </div>
        <div class="speaker-inline-actions">
          <button class="inline-action-btn" type="button" *ngIf="speakerStatus === 'speaking'" (click)="pauseSpeaking()" title="Pause">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="inline-action-btn" type="button" *ngIf="speakerStatus === 'paused'" (click)="resumeSpeaking()" title="Resume">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="inline-action-btn stop" type="button" (click)="cancelSpeaking()" title="Stop">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>
      </ng-container>

      <!-- Normal text input -->
      <input
        *ngIf="voiceStatus !== 'listening' && speakerStatus === 'idle'"
        type="text"
        [formControl]="messageControl"
        class="text-input"
        placeholder="Message AVA…"
        id="chat-message-input"
        (keydown.enter)="$event.preventDefault(); sendMessage()"
      />

      <!-- Mic button (RIGHT side) -->
      <button
        class="mic-btn"
        [class.active]="voiceStatus === 'listening'"
        type="button"
        (click)="toggleListening()"
        [title]="voiceStatus === 'listening' ? 'Stop listening' : 'Use voice'"
        id="mic-toggle-btn"
      >
        <div class="mic-ring" *ngIf="voiceStatus === 'listening'"></div>
        <svg *ngIf="voiceStatus !== 'listening'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
        <svg *ngIf="voiceStatus === 'listening'" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="5" y="5" width="14" height="14" rx="2"></rect>
        </svg>
      </button>

      <!-- Send button (only when text exists and not listening) -->
      <button
        *ngIf="messageControl.value.trim() && voiceStatus !== 'listening'"
        class="send-btn"
        type="button"
        (click)="sendMessage()"
        [disabled]="isLoading"
        id="send-message-btn"
      >
        <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <svg *ngIf="isLoading" class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      </button>
    </div>
  </div>
</section>
