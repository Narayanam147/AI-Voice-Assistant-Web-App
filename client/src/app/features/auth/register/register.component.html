<div class="auth-wrapper">
  <div class="auth-decoration">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>
  
  <div class="auth-main">
    <div class="auth-container">
      <div class="auth-header text-center">
        <div class="brand-logo">
          <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
        <h1 class="brand-name">Join AVA</h1>
        <p class="brand-tagline">Your AI Voice Assistant — make life easy</p>
        <p class="subtitle">Write any text. Speak naturally. Get instant answers to every problem.</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
          </div>
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" class="form-control" formControlName="password" placeholder="Minimum 8 characters" />
          </div>
        </div>

        <div class="error-banner" *ngIf="errorMessage">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="isSubmitting || form.invalid">
          {{ isSubmitting ? 'Creating account...' : 'Create free account' }}
        </button>

        <div class="divider"><span>or</span></div>

        <button class="btn btn-outline btn-block social-btn" type="button" (click)="loginWithGoogle()">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign up with Google
        </button>
      </form>

      <div class="auth-footer text-center">
        <p>Already have an account? <a routerLink="/auth/login">Sign in to AVA</a></p>
      </div>
    </div>
  </div>

  <app-footer></app-footer>
</div>
